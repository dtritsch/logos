<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% seo %}
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">

  <!-- MathJax logic notation -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
</head>
<body>
  <header>
    <h1><a href="/" style="text-decoration:none; color:inherit;">{{ site.title }}</a></h1>
    <p><em>{{ site.tagline }}</em></p>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/syllabus/' | relative_url }}">Syllabus</a>
      <a href="{{ '/reading-vault/' | relative_url }}">Reading Vault</a>
      <a href="{{ '/case-studies/' | relative_url }}">Case Studies</a>
      <a href="{{ '/monographs/' | relative_url }}">Monographs</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }} — {{ site.description }}</p>
  </footer>
</body>
</html>
